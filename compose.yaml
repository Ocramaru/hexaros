services:
  hexapod:
    build: .
    image: hexapod-ros
    init: true                 # forwards Ctrl-C / docker stop so the node relaxes the servos
    network_mode: host         # ROS discovery between the container, the Pi and sparky
    devices:
      - /dev/i2c-1             # PCA9685 boards, ADC, IMU
      - /dev/gpiochip0         # GPIO 4 servo power, GPIO 27/22 ultrasonic
      # camera (OV5647 via libcamera): media controllers, sensor capture, ISP and codec nodes, frame buffers
      - /dev/media0
      - /dev/media1
      - /dev/media2
      - /dev/media3
      - /dev/media4
      - /dev/v4l-subdev0
      - /dev/video0
      - /dev/video10
      - /dev/video11
      - /dev/video12
      - /dev/video13
      - /dev/video14
      - /dev/video15
      - /dev/video16
      - /dev/video18
      - /dev/video19
      - /dev/video20
      - /dev/video21
      - /dev/video22
      - /dev/video23
      - /dev/video31
      - /dev/dma_heap
    volumes:
      - .:/ws                  # the workspace, live (not a copy)
    working_dir: /ws
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    stdin_open: true
    tty: true

