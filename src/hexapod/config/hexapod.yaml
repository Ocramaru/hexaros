# Gerry's hardware configuration, loaded as node parameters by the launch file; measured values live in calibration.yaml.
# Lists are leg-major in joints 0-2 order: leg0_joint0, leg0_joint1, leg0_joint2, leg1_joint0, ...
servo_controller:
  ros__parameters:
    board_addresses: [65, 64]  # 0x41 holds kit servos 0-15, 0x40 holds 16-31
    servo_map: [15, 14, 13, 12, 11, 10, 9, 8, 31, 22, 23, 27, 19, 20, 21, 16, 17, 18]

battery_monitor:
  ros__parameters:
    adc_address: 72  # 0x48, the ADS7830
    channels: [0, 4]
    names: [pack0, pack1]
    cells_in_series: 2
    warn_cell_volts: 3.3
    critical_cell_volts: 3.0
    design_capacity: 3.5  # Ah, IMREN 3500 mAh cells
    smoothing: 0.2
    period: 1.0
