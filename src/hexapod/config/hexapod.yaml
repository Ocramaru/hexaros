# Gerry's hardware configuration, loaded as node parameters by the launch file; measured values live in calibration.yaml.
# Per-joint maps are in joint order: legs leg-major (leg0_joint0, leg0_joint1, leg0_joint2, leg1_joint0, ...), then head pan and tilt.
servo_controller:
  ros__parameters:
    board_addresses: [65, 64]  # 0x41 holds kit servos 0-15, 0x40 holds 16-31
    servo_map: [15, 14, 13, 12, 11, 10, 9, 8, 31,  # legs 0-2
                22, 23, 27, 19, 20, 21, 16, 17, 18,  # legs 3-5
                0, 1]  # head
    servo_limits:  # [min, max] servo radians overrides for joints that dont default [0,pi]
      head_joint0: [0.873, 3.142]  # pan (50, 180) degrees

battery_monitor:
  ros__parameters:
    adc_address: 72  # 0x48, the ADS7830
    channels: [0, 4]
    names: [pack0, pack1]
    cells_in_series: 2
    warn_cell_volts: 3.3
    critical_cell_volts: 3.0
    design_capacity: 3.5  # Ah, IMREN 3500 mAh cells
    smoothing: 0.2
    period: 1.0

imu_sensor:
  ros__parameters:
    address: 104  # 0x68, the MPU6050
    frame_id: imu_link
    period: 0.01  # 100 Hz

imu_filter_madgwick:  # the node's own name: imu/data_raw in, imu/data with orientation out
  ros__parameters:
    use_mag: false
    publish_tf: false
    world_frame: enu

camera:  # gscam, or fake_camera in dry runs: camera/image_raw, camera/image_raw/compressed and camera/camera_info out
  ros__parameters:
    gscam_config: tcpclientsrc host=127.0.0.1 port=8554 ! jpegparse ! jpegdec ! videoconvert  # from deploy/rpicam-stream.service
    camera_name: ov5647
    frame_id: camera_link
    reopen_on_eof: true  # rpicam-vid restarts between clients
    sync_sink: false  # publish frames as they arrive
    width: 640  # fake_camera only; rpicam-stream.service sets the real size
    height: 480

ultrasonic_sensor:
  ros__parameters:
    trigger_pin: 27
    echo_pin: 22
    min_range: 0.02  # HC-SR04 datasheet
    max_range: 3.0  # the kit's limit
    field_of_view: 0.26  # 15 degrees, HC-SR04 datasheet
    frame_id: ultrasonic_link
    period: 0.1
