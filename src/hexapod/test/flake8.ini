[flake8]
# ament_flake8's defaults, plus the house style: two-space indent (E111, E114), one-line compound statements (E701), no line limit (E501)
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,E111,E114,E501,E701
import-order-style = google
application-import-names = hexapod
show-source = true
statistics = true
